name: OMP bridge compatibility

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: OMP ${{ matrix.omp-version }} / Node 22
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        omp-version: ["17.2.12", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          shims: "false"

      - name: Configure Socket Firewall npm wrapper
        run: |
          cat > "$RUNNER_TEMP/sfw-npm" <<'EOF'
          #!/bin/sh
          set -eu
          cutoff=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          exec sfw npm --before "$cutoff" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/sfw-npm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install bridge dependencies and OMP peers
        run: >-
          sfw-npm install --no-audit --no-fund --no-save
          @oh-my-pi/pi-ai@${{ matrix.omp-version }}
          @oh-my-pi/pi-coding-agent@${{ matrix.omp-version }}

      - name: Report installed OMP peer versions
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          for (const name of ["@oh-my-pi/pi-ai", "@oh-my-pi/pi-coding-agent"]) {
            const path = `node_modules/${name}/package.json`;
            const version = JSON.parse(fs.readFileSync(path, "utf8")).version;
            console.log(`${name} ${version}`);
          }
          NODE

      - name: Syntax-check every TypeScript source
        run: sfw-npm run check:source

      - name: Run unit and fake-process tests
        run: sfw-npm test

      - name: Typecheck against OMP ${{ matrix.omp-version }}
        run: sfw-npm run typecheck

      - name: Verify distributable package contents
        run: sfw-npm run check:package
