# Merge these keys into ~/.omp/agent/config.yml or <repo>/.omp/config.yml.
# `auto` lets the official CLI use its configured default. `high`/`medium`/`low`
# are selected through OMP's thinking strip. After running `agy models`, pick the
# exact logical family IDs you want per role.
modelRoles:
  default: official-agy/gemini-3.1-pro
  smol: official-agy/gemini-3.7-flash
  task: official-agy/gemini-3.7-flash
  slow: official-agy/gemini-3.1-pro
  plan: official-agy/gemini-3.1-pro
  vision: official-agy/gemini-3.7-flash
  advisor: official-agy/auto
# OMP task fan-out plus the bridge's own semaphore should remain bounded.
task:
  maxConcurrency: 3
